name: 功能建议
description: 提议符合安全、隐私和平台规则的新功能或改进
title: "[Feature] "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        安全、隐私和合规优先于功能完整度与开发速度。涉及数据、通信、自动化或第三方素材的建议必须完整说明。
  - type: textarea
    id: problem
    attributes:
      label: 玩家问题
      description: 描述当前遇到的实际问题，不要只描述按钮或实现方式。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 建议行为
      description: 说明用户如何主动使用、取消或关闭该功能。
    validations:
      required: true
  - type: textarea
    id: data-read
    attributes:
      label: 读取的数据
      description: 逐项列出需要读取的数据及必要性；不读取新增数据时填写“无”。
    validations:
      required: true
  - type: textarea
    id: data-store
    attributes:
      label: 保存的数据
      description: 说明保存内容、位置和清除方式；不保存时填写“无”。
    validations:
      required: true
  - type: textarea
    id: communication
    attributes:
      label: 通信与导出
      description: 说明是否发送游戏内消息、导出文本或传输到游戏外；列出频道、接收方、内容及触发条件。
    validations:
      required: true
  - type: textarea
    id: automation
    attributes:
      label: 自动化行为
      description: 说明是否自动发送聊天、出价、交易、邮件或执行其他可能代表玩家意图的行为。
    validations:
      required: true
  - type: textarea
    id: assets
    attributes:
      label: 代码与素材来源
      description: 说明是否使用第三方代码、UI、图片、字体、声音或文案，以及授权依据。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 是否可以用更少数据、更少自动化或纯本地方式解决？
    validations:
      required: true
  - type: checkboxes
    id: compliance
    attributes:
      label: 合规确认
      options:
        - label: 本建议不要求隐藏采集、隐藏通信或向游戏外自动上传数据。
          required: true
        - label: 本建议不要求后门、远程控制、外部程序或规避平台审核。
          required: true
        - label: 本建议不涉及博彩、现金交易、刷量、强制分享、关注或好评。
          required: true
        - label: 我理解有疑义的功能会暂停，必要时等待平台书面确认。
          required: true
